[project]
name = "snow-chatterbox-engine"
version = "0.1.0"
description = "Isolated Chatterbox GPU voice server for Snow (plan 01-33): its own environment, never imported by snow-core"
requires-python = "==3.12.*"
dependencies = [
    "chatterbox-tts==0.1.7",
    "torch==2.6.0",
    "torchaudio==2.6.0",
]

[tool.uv]
# Same delayed-adoption policy as the root project.
exclude-newer = "2026-10-08T00:00:00Z"
environments = ["sys_platform == 'win32'"]
# resemble-perth (Chatterbox's output watermarker) imports pkg_resources, which setuptools
# removed in 82; without it the watermarker is None and the model cannot load. This only
# caps the version of a package torch already pulls in; it adds no new package.
constraint-dependencies = ["setuptools<81"]

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
torchaudio = { index = "pytorch-cu124" }

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true
