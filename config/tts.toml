# Speech output (SPCH-03, SPCH-04). Typed by snow.voice.tts.config.TtsConfig.

# Spoken only by dev tools (`snow dev audition-voices` and the polish A/B hardware test),
# never on Snow's reply path (SPCH-01).
audition_line = "Good evening. This is how I sound, so tell me whether it suits you."

[audition]
# Cartesia voices spoken per run; each one costs credits (about 1 per character).
max_candidates = 8
# Stock voices from the research shortlist; heard first when Cartesia has them.
cartesia_shortlist = ["Daniel", "Archie", "Parker", "Jameson", "Corey", "Brandon", "Cory", "Alec", "Benedict", "Casper", "Caspian"]
# Built-in Pocket TTS presets heard in the audition. Licences (Kyutai tts-voices README):
# marius and javert are voice donations (CC0); george, charles, paul and michael are VCTK
# (CC BY 4.0, credit the dataset before distribution); peter_yearsley, stuart_bell and
# bill_boerst come from LibriVox through Voice-Zero (CC0). The non-commercial sets
# (expresso, ears) are left out on purpose.
pocket_voices = ["marius", "javert", "george", "charles", "paul", "michael", "peter_yearsley", "stuart_bell", "bill_boerst"]

[router]
# D-33: Cartesia for big moments, Chatterbox only on mains power with the GPU idle,
# Pocket TTS everyday, Kokoro last. The router walks this list per reply and skips an
# engine that is disabled below, not registered, ineligible for the reply or failing.
# User choice 2026-10-24: every reply in one voice, Kokoro bm_daniel at 0.9 (the user's
# reference script in the jarvis-voice folder). Pocket TTS only if Kokoro fails.
order = ["kokoro", "pocket_tts"]
# An engine that errored mid-reply is left alone this long, then tried again.
cooldown_s = 60.0

[playout]
# Local-engine audio starts after this much is buffered. Lower it only if the measured
# real-time factor of the voice allows (plan 01-26 SUMMARY has the numbers).
prebuffer_ms = 300
# If synthesis falls behind, Snow fades out, waits for this much audio (or the end of the
# clause) and fades back in, instead of leaving gaps for the rest of the reply.
rebuffer_ms = 250
# Above this synthesis real-time factor, a slow CPU (battery, load) makes Snow speak clause
# by clause, each one only once fully synthesized. The measured RTF appears in voice.log
# as tts_playout rtf=.
hold_rtf = 0.7
# VOIC-06: WebRTC echo cancellation (livekit) removes Snow's own voice from the mic, so
# speakers work and barge-in does not hear Snow. A startup warning is logged only when
# both settings are false (speakers, nothing removing the echo).
assume_headphones = false
echo_cancellation = true

[polish]
# Voice polish, applied to every voice in the reply push path, before the playout, so the
# echo reference matches what plays. The resample to the speaker's own rate is always on
# and is not listed here. Every part below can be switched off for an A/B listen.
trim_edges = true   # trim each clause's leading/trailing silence, 5 ms fades; false = off
compressor = true   # gentle 2.5:1 compression above -26 dBFS; false = off
makeup_db = 7.5     # louder by this much before the limiter (-1 dBFS ceiling); 0 = off
pace = 1.0          # 1.0 = off: Kokoro speed carries the pace, unpitched (user choice 2026-10-24)
sentence_pause_ms = 180  # silence after . ? ! between clauses; 0 = off
comma_pause_ms = 70      # silence after , ; : and a dash; 0 = off
eq = false          # off so the voice sounds exactly like the reference; true = warmth + presence + 10 kHz roll-off
warmth_db = 3.0     # low-shelf boost around 180 Hz (-6..6); 0 = flat
presence_db = 2.0   # bell boost around 2.8 kHz (-6..6); 0 = flat
reverb_wet = 0.0   # off (reference is dry); was 0.06 short plate-style reverb (0..0.2)

[engines.pocket_tts]
enabled = true
# The base voice. `path` is a built-in preset name, a .safetensors voice state or an audio
# file; `consent` is mandatory (self, consenting_person or licensed_preset) and a clip
# without it is refused at start (D-05, T-01-50). paul is Kyutai's VCTK preset p259
# (CC BY 4.0, credit the dataset before any distribution); research measured it the
# slowest and flattest of the presets the user liked. george (VCTK p315) is the A/B
# alternative: swap these six paths. `snow dev audition-voices` still rewrites them.
reference = { path = "paul", consent = "licensed_preset" }
torch_threads = 4

# D-34: the reply emotion picks a mood clip of the SAME voice. Until a licensed set of
# one speaker in several moods is available, every mood uses the base voice (paul), so
# the mood does not change the sound yet. Kyutai's expressive sets (expresso, ears) are
# non-commercial, and an audio clip needs the gated Pocket TTS weights with voice
# cloning (the user accepts those terms at huggingface.co/kyutai/pocket-tts).
[engines.pocket_tts.moods]
calm = { path = "paul", consent = "licensed_preset" }
upbeat = { path = "paul", consent = "licensed_preset" }
serious = { path = "paul", consent = "licensed_preset" }
playful = { path = "paul", consent = "licensed_preset" }
sympathetic = { path = "paul", consent = "licensed_preset" }

# The emotions the brain may choose (persona.toml allowed_emotions) -> a mood above.
# An emotion not listed here speaks in the calm mood.
[engines.pocket_tts.emotion_to_mood]
neutral = "calm"
content = "upbeat"
calm = "calm"
curious = "playful"
sympathetic = "sympathetic"
excited = "upbeat"

[engines.kokoro]
# Everyday voice since 2026-10-24 (SPCH-03): British male bm_daniel. Full-precision model, the same
# weights as the reference .pth. Not streaming, so the first clause is
# kept short. Files come from the official kokoro-onnx release into models/kokoro/ on first
# use and are checked against these SHA-256 values before they are loaded.
enabled = true
voice = "bm_daniel"
speed = 0.9  # the reference used 0.8; user picked 0.85, then 0.9 (2026-10-26)
threads = 4
model_url = "https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.onnx"
voices_url = "https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/voices-v1.0.bin"
model_sha256 = "7d5df8ecf7d4b1878015a32686053fd0eebe2bc377234608764cc0ef3636a6c5"
voices_sha256 = "bca610b8308e8d99f32e6fe4197e7ec01679264efed0cac9140fe9c29f1fbf7d"

[engines.cartesia]
# Big moments only (D-33, SPCH-03). Without a stored key, a voice id, credits or a
# connection the router speaks the big moment in the everyday voice (D-41).
enabled = true
ws_url = "wss://api.cartesia.ai/tts/websocket"
api_base = "https://api.cartesia.ai"
api_version = "2026-08-14"        # Cartesia-Version header (current in the API reference)
model = "sonic-3.6-2026-08-27"    # dated snapshot of sonic-3.6, never changes under us
voice_id = ""                     # `snow dev audition-voices` fills this; until then no Cartesia
voice_name = ""
key_name = "cartesia"
daily_char_budget = 650           # about 20,000 free credits a month / 30 days
probe_interval_s = 90             # free GET /voices?limit=1 while Cartesia is unavailable
# Cartesia has no remaining-balance endpoint: GET /usage/credits reports credits USED and
# needs an admin key (sk_car_admin_...). Left empty, the HUD shows "Unavailable".
credits_url = ""
sample_rate = 24000

[engines.chatterbox]
# D-33, D-39: the GPU voice speaks everyday replies only on mains power with the GPU idle
# and free; otherwise (and always when this process or the GPU fails) Pocket TTS speaks.
# It runs in its own uv environment and process (engines/chatterbox) and is stopped to free
# the VRAM the moment the conditions end. Without that environment synced it fails to
# load once, quietly, and Pocket carries on.
enabled = true
python = "engines/chatterbox/.venv/Scripts/python.exe"
server = "engines/chatterbox/server.py"
min_free_vram_mb = 3823     # measured on the RTX 4050: 3311 MB taken (peak 3142) + 512 MB
max_gpu_util = 30           # percent: above this something else is using the GPU
check_interval_s = 30       # power and GPU are looked at this often
unload_after_s = 300        # idle this long and the process is stopped, freeing the VRAM
load_timeout_s = 300        # first run also downloads the official ResembleAI weights
cfg_weight = 0.5
default_exaggeration = 0.5
# Optional, same consent rule as Pocket (D-05). Unset: Pocket's reference when that is an
# audio file, else Chatterbox's built-in default voice (a voice shift from Pocket's, D-32).
# reference = { path = "C:/path/to/my-voice.wav", consent = "self" }

# D-06 emotion -> exaggeration (0.25 flat .. 2.0 dramatic). Not listed: default_exaggeration.
[engines.chatterbox.exaggeration]
neutral = 0.5
content = 0.55
calm = 0.35
curious = 0.6
sympathetic = 0.45
excited = 0.8
