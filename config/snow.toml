# Hub settings and the worker table. `{python}` expands to the interpreter running the hub;
# a command whose first item has a path separator and is relative resolves from the repo root.
# Workers for modules not built yet exit or fail to launch and are logged, never fatal.

[hub]
allowed_origins = ["http://localhost:5173"]
retention_days = 30

[supervisor]
slow_after_s = 6.0   # workers beat every 2 s, so 6 s is three missed beats: logged, and the worker writes its Python stacks to logs/<worker>.err
hang_after_s = 20.0  # silent this long: killed and restarted
sleep_gap_s = 3.0    # a supervisor tick gap this long means the laptop slept, so heartbeats are reset, not judged

[workers.brain]
command = ["{python}", "-m", "snow.brain"]
enabled = true

[workers.voice]
command = ["{python}", "-m", "snow.voice"]
enabled = true

[workers.hud]
command = ["hud/node_modules/electron/dist/electron.exe", "hud"]
enabled = true
