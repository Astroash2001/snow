# Voice worker settings (CORE-04). Read by `python -m snow.voice`.

[audio]
input_device = ""    # empty = the Windows default microphone
sample_rate = 16000
frame_samples = 1280 # 80 ms; the frame size openWakeWord expects

[wake]
# The user's trained "hey snow" model (D-41, plan 01-30; recipe in training/wakeword).
# The file is gitignored: when it is absent Snow reports wake_word down and stays deaf.
model = "models/wakeword/hey_snow.onnx"
# v2 (2026-10-25): adds the user's voice and accent positives (training README 2c).
# v1 is kept as models/wakeword/hey_snow_v1.onnx, sha256 db2bc395...283b.
model_sha256 = "2da42e713d2814e05f8abddd2f79702347dd7e206440e18197a891224cea538a"
# A/B baseline: the pretrained stand-in. Its weights are CC BY-NC-SA 4.0 (personal use only).
# model = "hey_jarvis"
# 0.5, not the eval's optimal 0.21: the look-alike "hey so" peaks up to 0.75 on synthetic
# voices. Recalibrate from tests/hardware/test_wake_fp.py on the real mic.
threshold = 0.3   # was 0.5: recall on the user's voice was 33/50 (66 %) at three distances, 2026-10-24
patience_frames = 2
preroll_frames = 4   # 4 x 80 ms of RAM-only audio before the hit joins the turn (D-09)
refractory_s = 1.5
# Leading wake phrase and common ASR mishearings, stripped from the transcript.
strip_patterns = [
    '^\W*(?:hey|hay|hi|hello|ok|okay|a|hey,? a)[\s,.!?-]*(?:snow|sno|snoh|snoe)\b[\s,.!?:;-]*',
    # the A/B stand-in's phrase, kept while the hey_jarvis line above exists
    '^\W*(?:hey|hay|hi|hello|ok|okay|a|hate|hey,? a)[\s,.!?-]*(?:jarvis|jervis|jarvus|jarves|jarvas|javas|service)\b[\s,.!?:;-]*',
    '^\W*(?:jarvis|jervis)\b[\s,.!?:;-]*',
]

[turn]
vad_threshold = 0.5
start_secs = 0.2
stop_secs = 0.7  # was 0.2: a complete-sounding phrase ("Tell me one thing.") ended the turn in a mid-thought pause (UAT 2026-10-26)
max_silence_secs = 3.0
max_turn_secs = 30
wake_alone_window_s = 1.0
barge_in_min_ms = 400  # only the wake acknowledgement's cut-off: the next words stop that short voice
# While the echo canceller has heard under ~2 s of Snow's voice its cold residual measured
# up to 352 ms, so a first reply needs this much speech before it is paused.
barge_in_warmup_min_ms = 600
barge_gap_ms = 150     # quiet stretch tolerated inside the user's words
duck_after_ms = 150    # speech over Snow this long lowers its voice
duck_gain = 0.25       # about -12 dB
pause_after_ms = 300   # speech over Snow this long pauses it, holding the rest of the reply; plan 261026-wvr-02's hardware test tunes it
echo_tail_ms = 250     # audio this soon after a pause is left out of the check while Snow's echo dies away
verify_speech_ms = 700 # VAD speech in the check window that starts the check (research: 0.6-1.2 s)
check_min_speech_ms = 120  # an episode with this much speech is checked once when it goes quiet, so a one-word "Stop." is heard
quiet_resume_ms = 400  # this long with no speech ends an episode
reject_hold_s = 5.0    # after a rejected check, new speech only ducks Snow this long, so TV cannot make it stutter
duck_release_s = 4.0   # an unconfirmed episode gives the voice back (duck released, pause resumed) this long after its first speech

# The check on a paused episode. A verified user stops Snow with one word, like Jarvis;
# with no voiceprint (the degraded mode) Moonshine tiny-streaming gives no word
# confidences, so a single word counts as low-confidence and 2 are needed.
[barge_check]
min_words_verified = 1
min_words_unverified = 2
echo_match = 0.6       # a check whose words are this much Snow's own last words is an echo
echo_window_s = 10     # Snow's own words from this far back count
timeout_s = 2.0        # the local words check is given this long, then it fails closed (one-shot Moonshine measured 0.4-0.9 s warm, 2026-10-27)

# Speaker verification (VOIC-07 groundwork): TitaNet-small through sherpa-onnx tells the
# user's voice from the TV, other people and Snow's own voice. The voiceprint is made by
# `snow dev enroll-voice` and kept DPAPI-wrapped under %LOCALAPPDATA%\Snow, never in the repo.
# With no voiceprint Snow stays in the degraded words-only mode of [barge_check].
[speaker]
model_url = "https://github.com/k2-fsa/sherpa-onnx/releases/download/speaker-recongition-models/nemo_en_titanet_small.onnx"
model_sha256 = "ad4a1802485d8b34c722d2a9d04249662f2ece5d28a7a039063ca22f515a789e"
threshold = 0.35       # cosine to accept; enroll-voice stores a calibrated value (0.30-0.60)
min_threshold = 0.30
max_threshold = 0.60
min_margin = 0.15      # enroll-voice refuses to save when the user and Snow's voice sit closer than this
# Spoken only by the dev tool `snow dev enroll-voice` (as its calibration signal, and read
# aloud by the user), never on Snow's reply path (SPCH-01): the same exception as the
# audition_line in tts.toml. About 25 s read aloud; plain, phonetically varied English.
calibration_lines = [
    "The quick brown fox jumps over the lazy dog near the old stone bridge.",
    "Please open the window and tell me what the weather looks like this morning.",
    "Seven large boxes were carried up three flights of stairs before noon.",
    "She sells shells by the shore while the children chase the waves.",
    "Could you check whether the meeting has moved to Thursday afternoon?",
    "We walked along the river until the evening light turned everything gold.",
]

[conversation]
silence_timeout_s = 45  # inside D-08's 30-60 s, counted in audio time
reply_timeout_s = 20    # stop waiting for a reply that never comes

# Whole-utterance voice commands (matched locally, no LLM): never substrings.
[phrases]
end = ["that's all", "that is all", "thanks that's all", "thank you that's all", "that'll be all"]
sleep = ["go to sleep", "snow go to sleep"]
mute = ["mute", "snow mute", "mute yourself", "snow mute yourself"]

[stt]
final_deadline_s = 2.5 # Groq must answer within this, else the local final is used (T-01-38)
cooldown_s = 60        # a failed Groq is not called again for this long
min_voiced_s = 0.3     # a turn with less voiced sound than this (a cough, a click) is dropped before any Groq request

[stt.local]
model = "tiny"         # Moonshine streaming; the base size has no streaming build in 0.1.5
partial_interval_ms = 300

[stt.groq]
base_url = "https://api.groq.com/openai/v1"
key_name = "groq"
model = "whisper-large-v3-turbo"
language = "en"
timeout_s = 8
# Whisper spelling hints (up to 224 tokens). "Hey Snow" helps the wake-phrase strip
# patterns catch the wake word; change it together with the wake word.
# Agent names (Claude Code, Antigravity, OpenCode) come back in Phase 2: Whisper echoed
# them as a transcript the user never said (UAT G-01-15). A pure echo is dropped anyway.
prompt = "Hey Snow."
# A turn is dropped (no transcript, no reply) when every segment has no_speech_prob at or
# above the first and avg_logprob at or below the second: Whisper's own silence rule. The
# gap study suggested the tighter 0.4 / -0.5; this is the safer start because the mic sits
# 12-18 dB under reference and a dropped real command costs more than a rare hallucination
# letting through. Tune it from the groq_stt lines in voice.log.
silent_no_speech_prob = 0.6
silent_avg_logprob = -1.0

[tone]
# Prosody (loudness, pitch, pace) always runs. The emotion model is off: the only small
# CPU candidate, thomashallock/emotion2vec-web-distill (FunASR Model License, not
# permissive; misses most non-calm speech, plan 01-24 spike), stays unpinned. To try it:
#   model_url = "https://huggingface.co/thomashallock/emotion2vec-web-distill/resolve/566a831be26e64f7e641241c26154793b7dd1428/distill-student-v4.fused.onnx"
#   model_sha256 = "136b83ee1cbf16b102b341398534604a7f8ddadff1f07b50bc76739fa04a3795"
#   temperature = 0.0375
#   labels = [calm, content, warm, happy, amused, excited, surprised, smug, confused,
#             skeptical, annoyed, disgusted, afraid, angry, tense, sad, weary, bored]
# then run `uv run python -m snow.voice.tone` once to download and verify it.
model_url = ""
model_sha256 = ""
labels = []
temperature = 1.0
min_confidence = 0.4
loud_offset_db = 6    # above the user's median voiced level
quiet_offset_db = 8   # below it
fast_wpm = 170        # absolute pace limits until 3 turns of history exist
slow_wpm = 110
ref_loudness_dbfs = -24 # "normal" voiced level until history exists
wait_s = 0.3          # the transcript waits at most this long for the tone
